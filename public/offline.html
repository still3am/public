<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PUBLIC. — Offline</title>
    <meta name="theme-color" content="#000000" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body {
        background: #000;
        color: #e5e7eb;
        font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        overscroll-behavior: none;
        -webkit-user-select: none; user-select: none;
      }
      body { min-height: 100dvh; }
      .stage {
        min-height: 100dvh;
        max-width: 30rem;
        margin: 0 auto;
        padding: calc(1.5rem + env(safe-area-inset-top)) 1.25rem calc(9rem + env(safe-area-inset-bottom));
      }
      .mark {
        letter-spacing: -0.06em;
        font-weight: 900;
        font-size: 1.4rem;
        color: #f3f4f6;
        margin-bottom: 1.5rem;
      }
      .disc {
        width: 64px; height: 64px;
        animation: spin 3.2s linear infinite;
        margin: 0 auto 1.25rem;
        display: none;
      }
      .disc.spin { display: block; }
      .disc svg { width: 100%; height: 100%; display: block; }
      @keyframes spin { from { transform: rotate(0deg) } to { transform: rotate(360deg) } }
      .hd {
        font-size: 1.25rem; font-weight: 800;
        letter-spacing: -0.02em; color: #f3f4f6;
        margin-bottom: 0.5rem;
      }
      .sub { font-size: 0.9rem; line-height: 1.5; color: #6b7280; margin-bottom: 1.5rem; max-width: 22rem; }
      .topbar {
        display: flex; align-items: center; justify-content: space-between;
        margin-bottom: 1.25rem;
      }
      .heading {
        font-size: 0.72rem; font-weight: 800;
        letter-spacing: 0.16em; color: #6b7280; text-transform: uppercase;
      }
      .trygroup { display: flex; gap: 0.5rem; }
      .retry, .ghost {
        appearance: none; border: 1px solid #1f2937; background: #111;
        color: #e5e7eb; font-family: inherit; font-weight: 700;
        font-size: 0.82rem; padding: 0.6rem 1.25rem; border-radius: 9999px;
        display: inline-flex; align-items: center; gap: 0.45rem; cursor: pointer;
        transition: transform .08s ease, background .15s;
      }
      .retry:active, .ghost:active { transform: scale(0.96); }
      .retry:hover, .ghost:hover { background: #1a1a1a; }
      .ghost { background: transparent; color: #9ca3af; }
      .list { display: flex; flex-direction: column; gap: 2px; }
      .item {
        display: flex; align-items: center; gap: 0.75rem;
        padding: 0.55rem 0.5rem; border-radius: 10px; cursor: pointer;
        transition: background .12s;
      }
      .item:active { background: #ffffff0a; }
      .item.playing { background: #ffffff08; }
      .cover {
        width: 42px; height: 42px; border-radius: 7px; overflow: hidden;
        background: #161616; flex-shrink: 0;
        display: grid; place-items: center; color: #444; font-size: 0.65rem; font-weight: 800;
      }
      .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .meta { min-width: 0; flex: 1; }
      .title {
        font-size: 0.86rem; font-weight: 600; color: #e5e7eb;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .artist {
        font-size: 0.74rem; color: #6b7280;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .playbtn {
        width: 30px; height: 30px; border-radius: 9999px;
        display: grid; place-items: center; flex-shrink: 0;
        color: #d1d5db;
      }
      .playing .eq { display: flex; } .eq { display: none; gap: 2px; align-items: flex-end; height: 14px; }
      .eq span { width: 2.5px; background: #e5e7eb; border-radius: 2px; animation: eq 0.9s ease-in-out infinite; }
      .eq span:nth-child(1){ animation-delay: -.2s } .eq span:nth-child(2){ animation-delay: -.1s }
      .eq span:nth-child(3){ animation-delay: 0s }
      @keyframes eq { 0%,100%{height:25%} 50%{height:100%} }
      .empty {
        text-align: center; padding: 2.5rem 1rem; color: #4b5563; font-size: 0.9rem;
      }
      .np {
        position: fixed; left: 50%; transform: translateX(-50%);
        bottom: calc(0.75rem + env(safe-area-inset-bottom));
        width: calc(100% - 1.5rem); max-width: 28rem;
        background: #0a0a0a; border: 1px solid #1f1f1f; border-radius: 14px;
        padding: 0.55rem 0.75rem; display: none; align-items: center; gap: 0.75rem;
        box-shadow: 0 8px 30px rgba(0,0,0,0.6);
      }
      .np.show { display: flex; }
      .np .ncover { width: 38px; height: 38px; border-radius: 6px; overflow: hidden; background:#161616; flex-shrink:0; }
      .np .ncover img { width:100%; height:100%; object-fit:cover; }
      .np .nmeta { min-width:0; flex:1; }
      .np .ntitle { font-size:0.82rem; font-weight:600; color:#e5e7eb; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .np .nartist { font-size:0.72rem; color:#6b7280; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .np .nbtn { width:34px; height:34px; border-radius:9999px; display:grid; place-items:center; cursor:pointer; color:#e5e7eb; }
      .progress { height:3px; background:#1f1f1f; border-radius:2px; margin-top:0.5rem; overflow:hidden; }
      .progress .fill { height:100%; width:0; background:#e5e7eb; }
      .hint { margin-top: 1rem; font-size: 0.76rem; color: #4b5563; text-align:center; }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="mark">PUBLIC.</div>

      <div class="disc" id="disc">
        <svg viewBox="0 0 76 76" fill="none">
          <circle cx="38" cy="38" r="37" fill="#0a0a0a" stroke="#1f1f1f" stroke-width="1.5"/>
          <circle cx="38" cy="38" r="26" stroke="#262626" stroke-width="1"/>
          <circle cx="38" cy="38" r="14" stroke="#333" stroke-width="1"/>
          <circle cx="38" cy="38" r="4" fill="#4b4b4b"/>
        </svg>
      </div>
      <div class="hd">You're offline</div>
      <p class="sub">PUBLIC. can't reach the network. Your saved tracks below still play — no connection needed.</p>

      <div class="topbar">
        <div class="heading">Public Offline</div>
        <div class="trygroup">
          <button class="ghost" onclick="load()">Refresh</button>
          <button class="retry" onclick="location.reload()">Try again</button>
        </div>
      </div>

      <div class="list" id="list"></div>
      <div class="empty" id="empty" style="display:none">No saved tracks yet. Save tracks from the app while online to play them here offline.</div>
    </div>

    <div class="np" id="np">
      <div class="ncover" id="ncover"></div>
      <div class="nmeta">
        <div class="ntitle" id="ntitle"></div>
        <div class="nartist" id="nartist"></div>
        <div class="progress"><div class="fill" id="pfill"></div></div>
      </div>
      <div class="nbtn" id="nbtn" onclick="togglePlay()">▶</div>
    </div>

    <script>
      const DB_NAME = "public_offline";
      const STORE = "tracks";
      let records = [];
      let currentId = null;
      let objectUrl = null;
      const audio = new Audio();

      function openDB() {
        return new Promise((res, rej) => {
          const r = indexedDB.open(DB_NAME, 1);
          r.onupgradeneeded = () => {
            const db = r.result;
            if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath: "id" });
          };
          r.onsuccess = () => res(r.result);
          r.onerror = () => rej(r.error);
        });
      }
      async function getAll() {
        try {
          const db = await openDB();
          return await new Promise((res, rej) => {
            const t = db.transaction(STORE, "readonly").objectStore(STORE);
            const g = t.getAll();
            g.onsuccess = () => res(g.result || []);
            g.onerror = () => rej(g.error);
          });
        } catch { return []; }
      }
      function fmt(sec) {
        if (!sec) return "--:--";
        const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
        return m + ":" + (s < 10 ? "0" + s : s);
      }

      async function load() {
        records = await getAll();
        records.sort((a, b) => (b._savedAt || 0) - (a._savedAt || 0));
        const list = document.getElementById("list");
        const empty = document.getElementById("empty");
        list.innerHTML = "";
        if (!records.length) { empty.style.display = "block"; return; }
        empty.style.display = "none";
        records.forEach((r) => {
          const el = document.createElement("div");
          el.className = "item";
          el.dataset.id = r.id;
          el.onclick = () => play(r);
          const cov = document.createElement("div");
          cov.className = "cover";
          if (r.cover_art_url) {
            const img = document.createElement("img");
            img.src = r.cover_art_url;
            cov.appendChild(img);
          } else { cov.textContent = (r.genre || "—").slice(0, 2).toUpperCase(); }
          const meta = document.createElement("div");
          meta.className = "meta";
          meta.innerHTML = '<div class="title"></div><div class="artist"></div>';
          meta.querySelector(".title").textContent = r.title || "Unknown";
          meta.querySelector(".artist").textContent = (r.artist || r.uploader_name || "") + "  ·  " + fmt(r.duration_seconds);
          const pb = document.createElement("div");
          pb.className = "playbtn";
          const eq = document.createElement("div");
          eq.className = "eq";
          eq.innerHTML = "<span style='height:40%'></span><span style='height:100%'></span><span style='height:60%'></span>";
          const tri = document.createElement("span"); tri.textContent = "▶"; tri.style.fontSize = "0.8rem";
          pb.appendChild(eq); pb.appendChild(tri);
          el.appendChild(cov); el.appendChild(meta); el.appendChild(pb);
          list.appendChild(el);
        });
      }

      function clearPlayingMarks() {
        document.querySelectorAll(".item").forEach((el) => {
          el.classList.toggle("playing", el.dataset.id === currentId);
        });
      }

      function play(r) {
        if (currentId !== r.id) {
          if (objectUrl) URL.revokeObjectURL(objectUrl);
          objectUrl = URL.createObjectURL(r._blob);
          audio.src = objectUrl;
          currentId = r.id;
          const np = document.getElementById("np");
          np.classList.add("show");
          const ncover = document.getElementById("ncover");
          ncover.innerHTML = "";
          if (r.cover_art_url) {
            const img = document.createElement("img"); img.src = r.cover_art_url; ncover.appendChild(img);
          }
          document.getElementById("ntitle").textContent = r.title || "Unknown";
          document.getElementById("nartist").textContent = r.artist || r.uploader_name || "";
        }
        clearPlayingMarks();
        document.getElementById("disc").classList.add("spin");
        document.getElementById("nbtn").textContent = "⏸";
        audio.play().catch(() => {
          document.getElementById("nbtn").textContent = "▶";
        });
      }

      function togglePlay() {
        if (!currentId) return;
        if (audio.paused) { audio.play(); document.getElementById("nbtn").textContent = "⏸"; document.getElementById("disc").classList.add("spin"); }
        else { audio.pause(); document.getElementById("nbtn").textContent = "▶"; document.getElementById("disc").classList.remove("spin"); }
      }

      audio.addEventListener("ended", () => {
        document.getElementById("nbtn").textContent = "▶";
        document.getElementById("disc").classList.remove("spin");
        const idx = records.findIndex((r) => r.id === currentId);
        if (idx >= 0 && idx < records.length - 1) play(records[idx + 1]);
      });
      audio.addEventListener("timeupdate", () => {
        if (audio.duration) {
          document.getElementById("pfill").style.width = (audio.currentTime / audio.duration * 100) + "%";
        }
      });

      load();
    </script>
  </body>
</html>
