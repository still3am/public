<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PUBLIC. — Offline</title>
    <meta name="theme-color" content="#000000" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body {
        height: 100%;
        background: #000;
        color: #6b7280;
        font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        overscroll-behavior: none;
      }
      .stage {
        min-height: 100%;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.5rem;
        text-align: center;
      }
      .mark {
        letter-spacing: -0.06em;
        font-weight: 900;
        font-size: 1.5rem;
        color: #f3f4f6;
        margin-bottom: 2.5rem;
      }
      .disc {
        position: relative;
        width: 76px;
        height: 76px;
        margin-bottom: 1.75rem;
        animation: spin 3.2s linear infinite;
      }
      .disc svg { width: 100%; height: 100%; display: block; }
      .disc .bar {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 7px;
        height: 18px;
        background: #000;
        border-radius: 2px;
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      h1 {
        color: #f3f4f6;
        font-size: 1.35rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin-bottom: 0.6rem;
      }
      p {
        font-size: 0.95rem;
        line-height: 1.5;
        max-width: 22rem;
        color: #6b7280;
        margin-bottom: 2rem;
      }
      .retry {
        appearance: none;
        border: 1px solid #1f2937;
        background: #111;
        color: #e5e7eb;
        font-family: inherit;
        font-weight: 700;
        font-size: 0.9rem;
        padding: 0.75rem 1.75rem;
        border-radius: 9999px;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        cursor: pointer;
        transition: transform .08s ease, background .15s;
      }
      .retry:active { transform: scale(0.97); }
      .retry:hover { background: #1a1a1a; }
      .hint {
        margin-top: 1.75rem;
        font-size: 0.8rem;
        color: #4b5563;
      }
      @media (prefers-color-scheme: light) {
        :root:not(.dark) body { background: #fff; }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="mark">PUBLIC.</div>
      <div class="disc">
        <svg viewBox="0 0 76 76" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="38" cy="38" r="37" fill="#0a0a0a" stroke="#1f1f1f" stroke-width="1.5"/>
          <circle cx="38" cy="38" r="26" stroke="#262626" stroke-width="1"/>
          <circle cx="38" cy="38" r="14" stroke="#333" stroke-width="1"/>
          <circle cx="38" cy="38" r="4" fill="#4b4b4b"/>
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>
        PUBLIC. can't reach the network right now. Reconnect to keep
        listening, or open PUBLIC OFFLINE from your library to play saved
        tracks.
      </p>
      <button class="retry" onclick="location.reload()">Try again</button>
      <div class="hint">Your saved tracks are still available in PUBLIC OFFLINE.</div>
    </div>
  </body>
</html>
